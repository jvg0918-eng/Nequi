# Estética «tinta sobre papel»: fondo crema, trazo negro y un único acento rojo
# (el hilo rojo de la ilustración assets/ladron_tinta.jpg). El juego Brecha Nequi
# recibe la misma paleta desde core/juego_brecha.py.
[theme]
base = "light"
primaryColor = "#c8322a"
backgroundColor = "#f1ead9"
secondaryBackgroundColor = "#e8dfca"
textColor = "#1b1a17"
linkColor = "#c8322a"
borderColor = "#B9AD93"
showWidgetBorder = true
baseRadius = "6px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap, serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap, monospace"
headingFontWeights = [650, 600, 600, 600, 600, 600]
redColor = "#c8322a"
orangeColor = "#8c6a1e"
yellowColor = "#8c6a1e"
blueColor = "#3e6489"
greenColor = "#4a7657"
chartCategoricalColors = ["#c8322a", "#3e6489", "#8c6a1e", "#4a7657", "#4a453d", "#df978a", "#a6a093"]

# Barra lateral en papel oscuro: se distingue del área principal sin romper la calma de la portada.
[theme.sidebar]
backgroundColor = "#E9E1CF"
secondaryBackgroundColor = "#E0D7C2"
textColor = "#1b1a17"
borderColor = "#CFC3A9"

[client]
toolbarMode = "minimal"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
