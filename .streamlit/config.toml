# Identidad visual compartida con el juego «Brecha Nequi» (assets/brecha_nequi.html):
# fondo nocturno, magenta Nequi como acento y tipografías Fraunces / IBM Plex.
[theme]
base = "dark"
primaryColor = "#ff5fae"
backgroundColor = "#0b0a14"
secondaryBackgroundColor = "#15131f"
textColor = "#ece8f6"
linkColor = "#ff8cc4"
borderColor = "#2a2640"
showWidgetBorder = true
baseRadius = "10px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap, serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap, monospace"
headingFontWeights = [650, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#ff5fae", "#4fb4ff", "#ffcc4d", "#35e2a0", "#b23fd1", "#ff8a4c", "#8a82ad"]

[theme.sidebar]
backgroundColor = "#0f0d1a"
secondaryBackgroundColor = "#1a1728"

[client]
toolbarMode = "minimal"

[server]
runOnSave = false
